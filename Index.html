<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escáner QR</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f172a; color: #fff; font-family: system-ui, sans-serif; }
  #contenedor { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; }
  video { flex: 1; width: 100%; object-fit: cover; background: #000; }
  #marco { position: absolute; top: 50%; left: 50%; width: 65vmin; height: 65vmin; transform: translate(-50%, -60%);
           border: 3px solid #6366f1; border-radius: 16px; box-shadow: 0 0 0 100vmax rgba(0,0,0,.45); pointer-events: none; }
  #estado { padding: 12px; text-align: center; font-size: 14px; background: #1e293b; }
  #estado.error { color: #fda4af; }
</style>
</head>
<body>
<div id="contenedor">
  <video id="video" playsinline muted></video>
  <div id="marco"></div>
  <div id="estado">Iniciando cámara...</div>
</div>
<canvas id="lienzo" style="display:none"></canvas>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
// Respaldo si se abre la página sin el parámetro ?app= (URL de tu Apps Script, termina en /exec)
const URL_APP_RESPALDO = 'PEGA_AQUI_TU_URL_/exec';

const parametrosUrl = new URLSearchParams(location.search);
const appRecibida = parametrosUrl.get('app') || '';
// Solo se acepta una URL de Apps Script (evita redirecciones a sitios ajenos)
const URL_APP = /^https:\/\/script\.google\.com\//.test(appRecibida) ? appRecibida : URL_APP_RESPALDO;

const video = document.getElementById('video');
const lienzo = document.getElementById('lienzo');
const ctx = lienzo.getContext('2d', { willReadFrequently: true });
const estado = document.getElementById('estado');
const detector = ('BarcodeDetector' in window) ? new BarcodeDetector({ formats: ['qr_code'] }) : null;

let flujo = null;
let leyendo = true;

function mostrarError(texto) {
  estado.textContent = texto;
  estado.className = 'error';
}

async function iniciar() {
  try {
    flujo = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    video.srcObject = flujo;
    await video.play();
    estado.textContent = 'Apunta al código QR';
    buclePrincipal();
  } catch (e) {
    mostrarError('No se pudo abrir la cámara (' + (e && e.name ? e.name : 'sin permiso') + ').');
  }
}

async function leerCuadro() {
  if (detector) {
    try {
      const r = await detector.detect(video);
      if (r.length) return r[0].rawValue;
    } catch (e) { /* se intenta con jsQR */ }
  }
  if (!window.jsQR || !video.videoWidth) return null;
  const escala = Math.min(1, 800 / video.videoWidth);
  lienzo.width = Math.round(video.videoWidth * escala);
  lienzo.height = Math.round(video.videoHeight * escala);
  ctx.drawImage(video, 0, 0, lienzo.width, lienzo.height);
  const datos = ctx.getImageData(0, 0, lienzo.width, lienzo.height);
  const qr = jsQR(datos.data, lienzo.width, lienzo.height, { inversionAttempts: 'dontInvert' });
  return qr && qr.data ? qr.data : null;
}

async function buclePrincipal() {
  while (leyendo) {
    const texto = await leerCuadro();
    if (texto) { alLeer(texto); return; }
    await new Promise(r => setTimeout(r, 150)); // ~6 lecturas por segundo
  }
}

function apagarCamara() {
  leyendo = false;
  if (flujo) flujo.getTracks().forEach(t => t.stop());
}

/** Respaldo: abre la app con ?codigo= (recarga completa de Apps Script). */
function redirigir(texto) {
  let destino;
  try {
    new URL(texto);
    destino = texto; // el QR ya es una URL de tu app
  } catch (e) {
    destino = URL_APP + '?codigo=' + encodeURIComponent(texto.trim());
  }
  location.href = destino;
}

function alLeer(texto) {
  apagarCamara();
  estado.textContent = 'QR leído';
  if (navigator.vibrate) navigator.vibrate(80);

  // Camino rápido: avisar a la pestaña de la app (sin recargarla) y cerrar esta
  if (window.opener && !window.opener.closed) {
    let confirmado = false;
    window.addEventListener('message', e => {
      if (e.source === window.opener && e.data && e.data.tipo === 'ack') {
        confirmado = true;
        estado.textContent = 'Listo. Vuelve a la app.';
        window.close();
      }
    });
    try {
      window.opener.postMessage({ tipo: 'qr', codigo: texto }, '*');
    } catch (e) { redirigir(texto); return; }
    // Si la app no confirma, se usa el respaldo
    setTimeout(() => { if (!confirmado) redirigir(texto); }, 800);
    return;
  }
  redirigir(texto);
}

window.addEventListener('pagehide', apagarCamara);
iniciar();
</script>
</body>
</html>
